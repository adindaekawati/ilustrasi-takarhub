<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAKAR Hub · Satu ton dihitung sekali</title>
<meta name="description" content="Prototipe lomba esai TAKAR Hub. Seluruh data fiktif atau ilustrasi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== 1. TOKEN WARNA & DASAR ===================== */
:root{
  --brand:#099ec8; --brand-dark:#067a9c; --brand-soft:#9cd8e9; --brand-50:#ecf8fc;
  --green:#84bc41; --green-dark:#4d7a1c; --green-soft:#cde4b3;
  --yellow:#f9c416; --yellow-soft:#fdf0bf;
  --orange:#F97316; --orange-dark:#b4500a; --orange-soft:#ffe4cf;
  --lavender:#DDD6FE; --lav-ink:#4c3d99;
  --ink:#1E293B; --ink-2:#475569; --ink-3:#64748b; --ink-deep:#0F172A;
  --bg:#F8FAFC; --white:#FFFFFF; --line:#e2e8f0; --line-2:#eef2f6;
  --r-sm:12px; --r:20px; --r-lg:28px;
  --sh-1:0 1px 2px rgba(15,23,42,.05),0 2px 8px rgba(15,23,42,.05);
  --sh-2:0 2px 6px rgba(15,23,42,.06),0 12px 28px rgba(9,158,200,.10);
  --sh-3:0 10px 30px rgba(15,23,42,.12),0 30px 60px rgba(9,158,200,.14);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
p{margin:0 0 .8em}
a{color:var(--brand-dark)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em;word-break:break-all}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--ink-3)} .small{font-size:.86rem} .xs{font-size:.76rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}

/* ===================== 2. KOMPONEN ===================== */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s,background .2s,color .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(9,158,200,.32)}
.btn-primary:hover{background:var(--brand-dark);box-shadow:0 10px 22px rgba(9,158,200,.38);transform:translateY(-1px)}
.btn-outline{background:#fff;color:var(--brand-dark);box-shadow:inset 0 0 0 2px var(--brand-soft)}
.btn-outline:hover{box-shadow:inset 0 0 0 2px var(--brand);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);padding:9px 14px}
.btn-ghost:hover{background:var(--brand-50)}
.btn-white{background:#fff;color:var(--ink-deep)}
.btn-white:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.btn-sm{padding:7px 14px;font-size:.86rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-orange{background:var(--orange);color:#fff}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh-1);padding:20px;border:1px solid var(--line-2);transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.card.hov:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.card h3{font-size:1.02rem}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip-brand{background:var(--brand-50);color:var(--brand-dark)}
.chip-green{background:var(--green-soft);color:var(--green-dark)}
.chip-yellow{background:var(--yellow-soft);color:#6b5000}
.chip-orange{background:var(--orange-soft);color:var(--orange-dark)}
.chip-lav{background:var(--lavender);color:var(--lav-ink)}
.chip-gray{background:#eef2f6;color:var(--ink-2)}
.chip-dark{background:var(--ink-deep);color:#fff}
.lbl{display:inline-flex;align-items:center;border-radius:6px;padding:1px 6px;font-size:.66rem;font-weight:800;letter-spacing:.06em;cursor:help;vertical-align:middle;margin-left:4px}
.lbl-FAKTA{background:#e3f4d3;color:#3d6315}.lbl-ASUMSI{background:var(--yellow-soft);color:#6b5000}.lbl-USULAN{background:var(--lavender);color:var(--lav-ink)}.lbl-FIKTIF,.lbl-ILUSTRASI{background:#eef2f6;color:var(--ink-2)}.lbl-HITUNGAN{background:var(--brand-50);color:var(--brand-dark)}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ok{color:var(--green-dark)} .warn{color:#7a5d00} .bad{color:var(--orange-dark)}
.ico-circle{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.pastel-1{background:#dff3fa;color:var(--brand-dark)}.pastel-2{background:#e8f4da;color:var(--green-dark)}.pastel-3{background:#fdf0bf;color:#6b5000}.pastel-4{background:#ede9fe;color:var(--lav-ink)}.pastel-5{background:#ffe9d8;color:var(--orange-dark)}.pastel-6{background:#e0f2fe;color:#075985}
.table-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);background:#f8fbfd;position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.input,select.input{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;transition:border-color .2s,box-shadow .2s;width:100%}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(9,158,200,.15);outline:0}
.input[readonly]{background:#f6f9fb}
input[type=range]{width:100%;accent-color:var(--brand)}
.seg{display:inline-flex;background:#eef4f7;border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-dark);box-shadow:var(--sh-1)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:0;background:#eef4f7;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--ink-2);transition:all .2s}
.tab[aria-selected="true"]{background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(9,158,200,.28)}
.tab:hover{transform:translateY(-1px)}
.term{border-bottom:1.5px dotted var(--brand);cursor:help}
.tip{position:fixed;z-index:200;max-width:280px;background:var(--ink-deep);color:#fff;font-size:.8rem;padding:10px 12px;border-radius:12px;box-shadow:var(--sh-3);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.show{opacity:1;transform:none}
.trace-num{cursor:pointer;border-bottom:2px dashed var(--brand-soft);transition:border-color .2s,background .2s;border-radius:4px}
.trace-num:hover{border-color:var(--brand);background:var(--brand-50)}
.lock-card{text-align:center;padding:48px 24px;max-width:560px;margin:30px auto}
.progress{height:10px;background:#eef2f6;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-soft));border-radius:99px;width:0;transition:width 1s var(--ease)}
.kpi .v{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.kpi .t{font-size:.8rem;color:var(--ink-3);font-weight:600}
.callout{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.callout.info{background:var(--brand-50)} .callout.warn{background:var(--yellow-soft)} .callout.bad{background:var(--orange-soft)} .callout.ok{background:#eef7e3}
.formula{font-family:var(--mono);background:#f4f8fb;border:1px dashed var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:.84rem;overflow:auto}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

/* ===================== 3. LANDING ===================== */
.nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(226,232,240,.7)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--ink);text-decoration:none}
.logo b{color:var(--brand)}
.menu{display:flex;gap:4px;margin:0 auto}
.menu a{padding:8px 12px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.92rem;position:relative;border-radius:10px}
.menu a:hover{color:var(--ink);background:var(--brand-50)}
.menu a.active{color:var(--ink)}
.menu a.active::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:3px;border-radius:3px;background:var(--brand)}
.burger{display:none}
@media (max-width:960px){.menu{display:none}.burger{display:inline-flex;margin-left:auto}.nav .btn-ghost.hide-m{display:none}}
.mobile-menu{display:none;padding:10px 20px 18px;border-top:1px solid var(--line)}
.mobile-menu.open{display:grid;gap:4px}
.mobile-menu a{padding:10px;text-decoration:none;color:var(--ink);font-weight:600;border-radius:10px}
.hero{position:relative;overflow:hidden;padding:56px 0 40px;background:radial-gradient(1200px 500px at 85% -10%,#d8f1f9 0,transparent 60%),radial-gradient(800px 420px at -10% 30%,#eaf7fb 0,transparent 60%),var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.02fr 1fr;gap:40px;align-items:center;position:relative}
@media (max-width:960px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.mock-stage{min-height:0}}
.badge-top{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-size:.82rem;font-weight:700;box-shadow:var(--sh-1)}
.badge-top span{background:var(--brand);color:#fff;border-radius:999px;padding:2px 10px}
.hero h1{font-size:clamp(2rem,4.6vw,3.35rem);font-weight:800;margin:18px 0 14px;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--brand);position:relative}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:10px;background:var(--brand-soft);opacity:.45;z-index:-1;border-radius:6px}
.hero p.lead{font-size:1.08rem;color:var(--ink-2);max-width:540px}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-weight:700;font-size:.9rem}
.trust span{display:inline-flex;align-items:center;gap:6px}
.mock-stage{position:relative;min-height:440px}
.laptop{position:relative;background:#0f172a;border-radius:20px 20px 8px 8px;padding:10px 10px 14px;box-shadow:var(--sh-3);max-width:560px;margin-left:auto}
.laptop .scr{background:#fff;border-radius:12px;overflow:hidden;min-height:300px}
.laptop::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-14px;height:14px;background:linear-gradient(#cfd8e0,#a9b6c2);border-radius:0 0 18px 18px}
.mini-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-2);font-size:.72rem;font-weight:700}
.mini-body{display:grid;grid-template-columns:72px 1fr;min-height:270px}
.mini-side{background:#0f2a3a;display:grid;align-content:start;gap:8px;padding:12px 10px}
.mini-side i{display:block;height:8px;border-radius:4px;background:#2b4b5e}
.mini-side i.on{background:var(--brand)}
.mini-main{padding:12px;display:grid;gap:10px}
.mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-kpi{background:#f6fafc;border-radius:10px;padding:8px}
.mini-kpi b{display:block;font-size:.9rem}
.mini-kpi small{font-size:.6rem;color:var(--ink-3);font-weight:600}
.phone{position:absolute;left:0;bottom:-10px;width:190px;background:#0f172a;border-radius:30px;padding:9px;box-shadow:var(--sh-3)}
.phone .scr{background:#fff;border-radius:22px;min-height:320px;padding:14px 12px;font-size:.72rem}
@media (max-width:960px){.phone{display:none}.laptop{margin:0 auto}}
.float-chip{position:absolute;background:#fff;border-radius:14px;box-shadow:var(--sh-2);padding:8px 12px;font-size:.78rem;font-weight:700;display:flex;gap:8px;align-items:center;animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.strip{margin-top:-6px;padding:30px 0}
.strip .grid{grid-template-columns:repeat(6,1fr);gap:14px}
@media (max-width:1000px){.strip .grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.strip .grid{grid-template-columns:repeat(2,1fr)}}
.strip-item{text-align:center;padding:16px 10px;border-radius:var(--r);transition:background .2s,transform .2s}
.strip-item:hover{background:#fff;transform:translateY(-3px);box-shadow:var(--sh-1)}
.strip-item .ico-circle{margin:0 auto 10px}
.strip-item b{display:block;font-size:.9rem}
.strip-item small{color:var(--ink-3);font-size:.78rem}
.section{padding:64px 0}
.eyebrow{color:var(--brand-dark);font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.section h2{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.moment{background:linear-gradient(135deg,#fff 0,#f0fafd 100%);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;border:1px solid #e6f4f9}
@media (max-width:860px){.moment{grid-template-columns:1fr}}
.big-switch{display:flex;align-items:center;gap:14px;font-weight:800;flex-wrap:wrap}
.switch{position:relative;width:86px;height:44px;border-radius:99px;border:0;background:var(--green);cursor:pointer;transition:background .3s;flex:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.15)}
.switch::after{content:"";position:absolute;top:5px;left:5px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .35s var(--ease)}
.switch[aria-checked="true"]{background:var(--orange)}
.switch[aria-checked="true"]::after{left:47px}
.switch.lg{width:110px;height:56px}.switch.lg::after{width:46px;height:46px}.switch.lg[aria-checked="true"]::after{left:59px}
.tax-big{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.feat-card{cursor:pointer;position:relative}
.feat-card .new{position:absolute;top:14px;right:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{position:relative;cursor:pointer}
.step .n{position:absolute;top:14px;right:16px;font-weight:800;color:#cbd5e1;font-size:1.6rem}
.step:hover .n{color:var(--brand)}
.roles .card{cursor:pointer}
.testi .stars{color:var(--yellow);letter-spacing:2px}
.cta{background:radial-gradient(600px 300px at 90% 0,rgba(9,158,200,.45),transparent 70%),var(--ink-deep);color:#fff;border-radius:var(--r-lg);padding:40px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer.foot{background:var(--ink-deep);color:#cbd5e1;padding:48px 0 30px;margin-top:64px}
footer.foot a{color:#e2e8f0;text-decoration:none}
footer.foot .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}
@media (max-width:760px){footer.foot .cols{grid-template-columns:1fr 1fr}}
.social{display:flex;gap:10px}
.social a{width:36px;height:36px;border-radius:50%;background:#1e293b;display:grid;place-items:center}
.social a:hover{background:var(--brand)}

/* ===================== 4. PORTAL ===================== */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#0c2433;color:#cfe3ec;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{color:#fff;padding:6px 8px 16px}
.side .logo b{color:var(--brand-soft)}
.side nav{display:grid;gap:2px}
.side .grp{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#7fa2b3;padding:14px 10px 6px;font-weight:800}
.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:#cfe3ec;text-decoration:none;font-weight:600;font-size:.88rem;transition:background .2s,color .2s}
.side a:hover{background:#13384b;color:#fff}
.side a.active{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(9,158,200,.35)}
.side a .k{margin-left:auto;font-size:.68rem;opacity:.7}
.side a.locked{opacity:.55}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(248,250,252,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;min-width:200px;color:var(--ink-3);cursor:pointer;font-size:.86rem}
.search:hover{border-color:var(--brand-soft)}
.kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line);border-radius:6px;padding:1px 5px;background:#f8fafc}
.topbar .sp{flex:1}
.role-sel{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;font-weight:700;font-size:.84rem}
.bell{position:relative}
.bell .cnt{position:absolute;top:2px;right:4px;background:var(--orange);color:#fff;font-size:.62rem;font-weight:800;border-radius:99px;padding:0 5px}
.ribbon{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;font-weight:700;font-size:.88rem;border-bottom:1px solid var(--line)}
.ribbon.f1{background:linear-gradient(90deg,#ede9fe,#f5f3ff)}
.ribbon.f2{background:linear-gradient(90deg,#dff3fa,#f0fafd)}
.ribbon.f3{background:linear-gradient(90deg,#e8f4da,#f4faee)}
.content{padding:22px 20px 90px;max-width:1240px;width:100%}
.screen-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.screen-head h1{font-size:1.5rem;font-weight:800;margin:0}
.screen-head .q{color:var(--ink-3);font-weight:600;margin-top:4px}
.fade-in{animation:fadein .35s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skel{background:linear-gradient(90deg,#eef2f6 25%,#f7f9fb 50%,#eef2f6 75%);background-size:200% 100%;animation:sk 1s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
.cycle{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
@media (max-width:900px){.cycle{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:600px){.cycle{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cyc{border-radius:14px;padding:10px;background:#f6f9fb;border:1.5px solid var(--line-2);cursor:pointer;transition:transform .2s,border-color .2s;font-size:.78rem}
.cyc:hover{transform:translateY(-2px);border-color:var(--brand-soft)}
.cyc .bar{height:6px;border-radius:4px;background:#e2e8f0;margin-bottom:8px}
.cyc.done .bar{background:var(--green)} .cyc.now .bar{background:var(--brand)} .cyc.attn .bar{background:var(--yellow)} .cyc.na{opacity:.55}
.cyc b{display:block;font-size:.82rem}

.alert-row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;cursor:pointer;transition:background .2s}
.alert-row:hover{background:#f4f8fb}
.bullet{position:relative;height:16px;background:#eef2f6;border-radius:99px;margin:12px 0 6px}
.bullet .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--brand)}

.test-card{border-left:6px solid var(--green)}
.test-card.y{border-left-color:var(--yellow)} .test-card.r{border-left-color:var(--orange)}
.drop{border:2px dashed var(--brand-soft);border-radius:16px;padding:18px;text-align:center;cursor:pointer;transition:background .2s,border-color .2s;background:#fbfeff}
.drop:hover{background:var(--brand-50);border-color:var(--brand)}
.lvv-list{display:grid;gap:8px}
.lvv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#f6f9fb;transition:all .4s var(--ease)}
.lvv.out{opacity:.35;text-decoration:line-through}
.lvv.pick{background:#eef7e3;box-shadow:inset 0 0 0 2px var(--green)}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper .s{flex:1;min-width:110px;padding:10px;border-radius:12px;background:#f1f5f9;font-size:.8rem;font-weight:700;text-align:center;transition:background .3s,color .3s}
.stepper .s.done{background:var(--green-soft);color:var(--green-dark)}

@media (max-width:900px){

<script>
/* ============================================================
   TAKAR Hub, prototipe lomba esai. Seluruh data fiktif/ilustrasi.
   ============================================================ */
'use strict';

/* ---------- 1. DATA: satu sumber kebenaran ---------- */
const DATA = {
  perusahaan: 'PT ABC Energy', kelas: 'PLTU non-mulut tambang 100 sampai 400 MW', tahunBuku: 2026,
  tarif: 30000,                 // Rp per t CO2e, UU 7/2021 Pasal 13 ayat (9) [FAKTA]
  batasKelas: 1.011,            // PTBAE-PU kelas ini, rilis Kementerian ESDM 2023 [FAKTA]
  output: 5000000,              // MWh [FIKTIF]

  batubaraTerpakai: 2535205,    // t [FIKTIF, diturunkan]

  scope2Memo: 30415,            // t, akun 2101 [FIKTIF]
  pembelianBatubara: 2580000,   // t menurut faktur [FIKTIF]
  intensitasRujukan: { v2: 1.317, v1: 1.278 }, faktorNilaiBaku: 1.25,

  bobotBulan: [.085,.078,.086,.082,.084,.083,.087,.088,.082,.085,.079,.081],
  sebaran: { mu: 1.072, sd: 0.192 }, // konversi Erfian dkk. dengan efisiensi 36% [ASUMSI]
  ujiLain: {
    scope2: { peserta: 4950000, pln: 4946000 },     // MWh [FIKTIF]
    cems: { buku: 8140, sispek: 8122 }              // jam operasi [FIKTIF]
  },
  bobotUji: { neraca: 30, intensitas: 20, scope2: 15, cems: 20, unit: 15 } // [ASUMSI]
};

/* ---------- 2. STATE aplikasi (tanpa penyimpanan peramban) ---------- */
const STATE = {
  phase: 2, role: 'peserta', verif: 'proses', opiniLevel: 'memadai',
  calcView: null,           // 'terverifikasi' | 'nilaibaku' (null = ikut status)
  unitsSurrendered: 0, explained: false, assigned: false,
  coretax: 0, prevalid: false, pembuktian: false,

  alloc: { transisi: 50, berkeadilan: 30, mrv: 20 },
  certIssued: false, supplierCodes: [], optOut: false, allocBasis: 'massa', certPurpose: 'cbam',
  landingToggle: false, landingTab: 'Data', featOpen: null,
  notifs: [], tampered: null, chain: [], corrections: 0,
  sim: { q: 5000000, i: 1.089, t: 30000 }, biayaUkur: 5e9,
  perms: { admin: [1,1,1,1], akuntan: [1,1,0,0], reviewer: [1,0,1,0] }
};

/* ---------- 3. HELPER FORMAT ---------- */
const nf = (d) => new Intl.NumberFormat('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt = (n, d = 0) => nf(d).format(n);
const fmtT = (n) => fmt(Math.round(n)) + ' t';
const fmtRp = (rp) => {
  if (Math.abs(rp) >= 1e12) return 'Rp' + fmt(rp / 1e12, 2) + ' triliun';
  if (Math.abs(rp) >= 1e9) return 'Rp' + fmt(rp / 1e9, 2) + ' miliar';
  if (Math.abs(rp) >= 1e6) return 'Rp' + fmt(rp / 1e6, 2) + ' juta';
  return 'Rp' + fmt(rp);
};
const fmtPct = (x, d = 2) => fmt(x * 100, d) + '%';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const LBL_TIP = {
  FAKTA: 'Bersumber dari regulasi, data resmi, atau jurnal yang dapat ditelusuri.',
  ASUMSI: 'Angka tanpa sumber yang dipakai untuk simulasi, alasannya dijelaskan di Pustaka Parameter.',
  USULAN: 'Rancangan penulis, belum diatur dalam regulasi.',
  FIKTIF: 'Data perusahaan rekaan untuk demo.',
  ILUSTRASI: 'Contoh untuk memperjelas, bukan data nyata.',
  HITUNGAN: 'Dihitung sistem dari angka lain di layar ini.'
};
const lbl = (k) => `<span class="lbl lbl-${k}" tabindex="0" data-tip="${esc(LBL_TIP[k])}">${k}</span>`;

const GLOSSARY = {
  'Scope 1': 'Emisi langsung dari sumber yang dimiliki atau dikendalikan entitas, misalnya pembakaran batubara di PLTU. Satu-satunya basis pajak di TAKAR.',
  'Scope 2': 'Emisi dari listrik atau uap yang dibeli. Ini Scope 1 milik pembangkit, sehingga di TAKAR hanya dicatat sebagai memo.',
  'Scope 3': 'Emisi lain di rantai nilai, misalnya prekursor yang dibeli. Hanya memo, tidak dipajaki.',
  'PTBAE-PU': 'Persetujuan Teknis Batas Atas Emisi Pelaku Usaha. Batas emisi per MWh yang ditetapkan Kementerian ESDM.',
  'SRUK': 'Sistem Registri Unit Karbon, registri nasional unit karbon yang dikelola KLH/BPLH.',
  'SISPEK': 'Sistem Informasi Pemantauan Emisi Industri Kontinu, tempat data CEMS terintegrasi (Permen LHK 13/2021).',
  'LVV': 'Lembaga Validasi dan Verifikasi GRK, terakreditasi KAN berdasarkan SNI ISO/IEC 17029 dan SNI ISO 14065.',
  'BPDLH': 'Badan Pengelola Dana Lingkungan Hidup, penyalur dana setelah alokasi APBN.',
  'nilai baku': 'Nilai emisi presumtif bagi peserta yang tidak lolos verifikasi. Sengaja dibuat lebih tinggi dari rerata agar mengukur menjadi pilihan rasional.',
  'CBAM': 'Carbon Border Adjustment Mechanism Uni Eropa. Importir menyerahkan sertifikat sebesar emisi tertanam barang impor.',
  'Coretax': 'Sistem inti administrasi perpajakan DJP.',
  'tirai fiskal': 'Aturan desain TAKAR. Verifikator tidak melihat dampak pajak dari temuannya agar penilaiannya tetap independen.'
};
const term = (t, shown) => `<span class="term" tabindex="0" data-tip="${esc(GLOSSARY[t] || '')}">${shown || t}</span>`;

/* ---------- 4. IKON (SVG buatan sendiri) ---------- */
const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  book: '<path d="M4 4h10a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 8h6M8 12h6"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  scale: '<path d="M12 4v16M5 20h14M6 8h12"/><path d="M6 8l-3 6h6zM18 8l-3 6h6z"/>',
  file: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  send: '<path d="M4 12l16-8-6 16-3-7z"/>',
  box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  swap: '<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
  link: '<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>',
  lib: '<path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l4 1-3 14-4-1z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 6 5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  play: '<path d="M7 4l13 8-13 8z"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  coins: '<ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M15 11c3.3 0 6 1.3 6 3s-2.7 3-6 3"/>',
  qr: '<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  leaf: '<path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15z"/><path d="M5 19c3-4 6-6 10-8"/>',
  hash: '<path d="M9 3L7 21M17 3l-2 18M4 9h17M3 15h17"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  flow: '<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/>'
};
const icon = (n, s = 20, extra = '') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICONS[n] || ''}</svg>`;

/* Maskot Takki: awan CO2 yang memegang timbangan */
const takki = (s = 64, mood = 'senang') => `<svg width="${s}" height="${s}" viewBox="0 0 120 120" role="img" aria-label="Takki, maskot TAKAR Hub">
  <defs><linearGradient id="tkg${s}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9f6"/><stop offset="1" stop-color="#7fcbe2"/></linearGradient></defs>
  <path d="M30 78c-12 0-20-8-20-18s8-18 19-18c3-12 13-20 26-20 14 0 25 10 27 23 10 1 18 9 18 18 0 9-8 15-18 15z" fill="url(#tkg${s})" stroke="#067a9c" stroke-width="3"/>
  <circle cx="50" cy="56" r="5" fill="#0F172A"/><circle cx="72" cy="56" r="5" fill="#0F172A"/>
  <circle cx="52" cy="54" r="1.6" fill="#fff"/><circle cx="74" cy="54" r="1.6" fill="#fff"/>
  ${mood === 'senang' ? '<path d="M53 66q8 7 16 0" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>' : '<path d="M54 69h14" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>'}
  <circle cx="42" cy="64" r="4" fill="#f9c416" opacity=".55"/><circle cx="80" cy="64" r="4" fill="#f9c416" opacity=".55"/>

  <path d="M44 88l-6 10h12zM78 88l-6 10h12z" fill="#84bc41" stroke="#4d7a1c" stroke-width="2"/>
</svg>`;

/* ---------- 5. MESIN HITUNG (semua angka turunan dari sini) ---------- */
const C = {
  faktorPerTon: () => DATA.nilaiKalor * DATA.faktorTJ / 1000,                // 2,1434
  e1101: () => DATA.batubaraTerpakai * C.faktorPerTon(),                      // 5.433.958
  e1102: () => DATA.solarKL * DATA.faktorSolar,                               // 11.042
  scope1: () => C.e1101() + C.e1102(),                                        // 5.445.000
  intensitas: () => C.scope1() / DATA.output,                                 // 1,089
  efisiensi: () => (DATA.output * 3.6) / (DATA.batubaraTerpakai * DATA.nilaiKalor),
  batas: () => DATA.batasKelas * DATA.output,                                 // 5.055.000
  intensitasRujukan: () => DATA.intensitasRujukan[STATE.paramVersion],
  nilaiBaku: () => DATA.faktorNilaiBaku * C.intensitasRujukan(),              // 1,64625
  eNilaiBaku: () => C.nilaiBaku() * DATA.output,                              // 8.231.250
  presumtif: () => STATE.verif === 'tidak_lolos',
  eEfektif: (view) => {
    const v = view || (C.presumtif() ? 'nilaibaku' : 'terverifikasi');
    return v === 'nilaibaku' ? C.eNilaiBaku() : C.scope1();
  },
  kelebihan: (view, units = STATE.unitsSurrendered) => Math.max(0, C.eEfektif(view) - C.batas() - units),
  pajakF2: (view, units) => C.kelebihan(view, units) * DATA.tarif,
  brutoF3: (view) => C.eEfektif(view) * DATA.tarif,
  // Fase 3: kliring tiga peserta contoh, k(i) = maks(0, 1 + beta (I_dasar - I_i)/I_dasar)
  kliring: (view, beta = STATE.beta, porsi = STATE.porsi) => {
    const ps = DATA.sektorF3.map((p) => {
      const e = p.self ? C.eEfektif(view) : p.q * p.i;
      return { nama: p.nama, q: p.q, e, i: e / p.q, self: !!p.self };
    });
    const sumE = ps.reduce((a, p) => a + p.e, 0), sumQ = ps.reduce((a, p) => a + p.q, 0);
    const iDasar = sumE / sumQ;
    ps.forEach((p) => { p.k = Math.max(0, 1 + beta * (iDasar - p.i) / iDasar); p.K = p.e * DATA.tarif; });
    const D = porsi * ps.reduce((a, p) => a + p.K, 0);
    const sumQk = ps.reduce((a, p) => a + p.q * p.k, 0);
    ps.forEach((p) => { p.bagian = sumQk ? D * p.q * p.k / sumQk : 0; p.R = Math.min(p.K, p.bagian); p.net = p.K - p.R; });
    const sisa = D - ps.reduce((a, p) => a + p.R, 0);
    return { ps, iDasar, D, sisa, self: ps.find((p) => p.self) };
  },
  pajakBersih: (phase = STATE.phase, view) => {
    if (phase === 3) return C.kliring(view).self.net;
    return C.pajakF2(view);
  },
  ujiNeraca: () => {
    const batubara = STATE.explained ? DATA.pembelianBatubara - (DATA.pembelianBatubara - DATA.batubaraTerpakai) : DATA.pembelianBatubara;
    const eHitung = batubara * C.faktorPerTon() + C.e1102();
    return { eHitung, dev: (C.scope1() - eHitung) / eHitung, kenaikanStok: DATA.pembelianBatubara - DATA.batubaraTerpakai };
  },
  devAwal: () => { const e = DATA.pembelianBatubara * C.faktorPerTon() + C.e1102(); return (C.scope1() - e) / e; },
  band: (absDev) => absDev <= 0.01 ? 'g' : absDev <= 0.05 ? 'y' : 'r',
  uji: () => {
    const n = C.ujiNeraca();
    const z = (C.intensitas() - DATA.sebaran.mu) / DATA.sebaran.sd;
    const s2 = (DATA.ujiLain.scope2.peserta - DATA.ujiLain.scope2.pln) / DATA.ujiLain.scope2.pln;
    const cm = (DATA.ujiLain.cems.buku - DATA.ujiLain.cems.sispek) / DATA.ujiLain.cems.sispek;
    return [
      { key: 'neraca', nama: 'Neraca bahan bakar', dev: n.dev, band: C.band(Math.abs(n.dev)) },
      { key: 'intensitas', nama: 'Kewajaran intensitas', dev: z, band: Math.abs(z) <= 1 ? 'g' : Math.abs(z) <= 2 ? 'y' : 'r', z: true },
      { key: 'scope2', nama: 'Rekonsiliasi Scope 2', dev: s2, band: C.band(Math.abs(s2)) },
      { key: 'cems', nama: 'Konsistensi CEMS', dev: cm, band: C.band(Math.abs(cm)) },
      { key: 'unit', nama: 'Keabsahan unit karbon', dev: 0, band: 'g' }
    ];
  },
  skorRisiko: () => {
    const v = { g: 0.05, y: 0.5, r: 1 };
    return C.uji().reduce((a, t) => a + DATA.bobotUji[t.key] * v[t.band], 0);
  },
  bulanan: () => DATA.bobotBulan.map((w) => w * C.scope1())
};

function gauge(score, size = 220) {
  const ang = -90 + (Math.min(100, score) / 100) * 180;
  const arc = (a0, a1, col) => { const r = 80, p = (a) => [110 + r * Math.cos((a - 180) * Math.PI / 180), 100 + r * Math.sin((a - 180) * Math.PI / 180)]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `<path d="M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}" stroke="${col}" stroke-width="18" fill="none"/>`; };
  return `<svg width="${size}" height="${size * 0.62}" viewBox="0 0 220 136" role="img" aria-label="Skor risiko ${fmt(score, 1)} dari 100">
    ${arc(0, 60, '#84bc41')}${arc(61, 120, '#f9c416')}${arc(121, 180, '#F97316')}
    <g class="needle" style="transform-origin:110px 100px;transform:rotate(${ang}deg);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)"><path d="M110 100L106 98L110 32L114 98Z" fill="#0F172A"/></g><circle cx="110" cy="100" r="8" fill="#0F172A"/>
    <text x="110" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#1E293B" class="num">${fmt(score, 1)}</text></svg>`;
}

    ['Catat', 'catat', 'done'], ['Uji silang', 'uji', STATE.explained ? 'done' : 'attn'],

  ].map((s, i) => ({ n: s[0], to: s[1], st: s[2], due: STEPS[i][4] }));

      <div class="card kpi"><div class="t">Saldo ${term('Scope 1')} (1xxx)</div><div class="v num">${fmt(C.scope1())} t</div><span class="chip chip-green">${icon('check', 12)} Basis pajak</span><button class="btn btn-ghost btn-sm" style="margin-top:8px" data-action="trace" data-key="scope1">${icon('link', 14)} Lacak ke jurnal</button></div>
      <div class="card kpi"><div class="t">Saldo ${term('Scope 2')} (2xxx)</div><div class="v num">${fmt(DATA.scope2Memo)} t</div><span class="chip chip-gray">Memo</span><button class="btn btn-ghost btn-sm" style="margin-top:8px" data-action="trace" data-key="scope2">${icon('link', 14)} Lacak ke jurnal</button></div>
      <div class="card kpi"><div class="t">Saldo ${term('Scope 3')} (3xxx)</div><div class="v num">0 t</div><span class="chip chip-gray">Memo</span><div class="xs muted" style="margin-top:8px">PLTU contoh belum mencatat prekursor.</div></div>
      <div class="card kpi"><div class="t">Dompet unit karbon (9xxx)</div><div class="v num">${fmt(avail)} unit</div><div class="xs muted">Tersedia dari ${fmt(DATA.unitTersedia)} dibeli · diserahkan ${fmt(STATE.unitsSurrendered)}</div><span class="status ok" style="margin-top:6px"><span class="dot" style="background:var(--green)"></span>${STATE.role === 'klh' ? 'Penuh lewat SRUK, ' : ''}terhubung SRUK (simulasi)</span></div></div>
      <div class="callout info" style="margin-top:14px">${icon('lock', 20)}<div class="small"><b>Periode Januari sampai Juni sudah ditutup.</b> Saldo periode tertutup tidak bisa diubah. Perbaikan dicatat sebagai jurnal koreksi baru beralasan dan berbukti, lalu disetujui verifikator.</div></div>`;
  } else if (t === 'baru') {
    const f = STATE.jForm, src = f.src === '1101';
    body = `<div class="grid g2"><div class="card"><b>Jurnal emisi baru</b> ${lbl('FIKTIF')}
      <div class="field" style="margin-top:12px"><label for="jSrc">Sumber emisi (akun)</label><select class="input" id="jSrc" data-input="jSrc"><option value="1101" ${src ? 'selected' : ''}>1101 Pembakaran batubara</option><option value="1102" ${!src ? 'selected' : ''}>1102 Bahan bakar penyala</option></select></div>
      <div class="grid g2" style="gap:10px"><div class="field"><label for="jAct">Data aktivitas</label><input class="input num" id="jAct" type="number" min="0" step="1" value="${f.act}" data-input="jAct"></div><div class="field"><label>Satuan</label><input class="input" readonly value="${src ? 't batubara' : 'kL solar'}"></div></div>
      ${src ? `<div class="field"><label>Nilai kalor ${lbl('ASUMSI')}</label><input class="input num" readonly value="${fmt(DATA.nilaiKalor)} GJ/t (uji lab)"></div>` : ''}
      <div class="field"><label>Faktor emisi dari pustaka</label><div class="row" style="gap:8px;flex-wrap:nowrap"><input class="input num" readonly value="${src ? fmt(DATA.faktorTJ, 2) + ' t CO₂/TJ' : fmt(DATA.faktorSolar, 2) + ' t CO₂/kL'}"><span class="chip chip-gray" tabindex="0" data-tip="Faktor khusus perusahaan hanya dengan uji lab atau CEMS dan persetujuan verifikator.">${icon('lock', 14)} Terkunci</span></div></div>
      <div class="field"><label for="jTier">Tingkat data</label><select class="input" id="jTier" data-input="jTier">${['CEMS', 'Uji lab', 'Faktor baku'].map((x) => `<option ${f.tier === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="drop" role="button" tabindex="0" data-action="fakeUpload" data-what="Bukti jurnal">${icon('upload', 22)}<div class="small"><b>Unggah bukti</b> (simulasi). Berkas diberi sidik digital saat diunggah.</div></div></div>
      <div class="card"><b>Hasil dihitung langsung</b> ${lbl('HITUNGAN')}<div class="formula" style="margin-top:10px" id="jFormula">${jFormula()}</div>
      <div style="font-size:2rem;font-weight:800;margin:14px 0" class="num" id="jOut">${fmt(jEmisi())} t CO₂e</div>
      <p class="small muted">Data, hitungan, dan keputusan dipisahkan. Kamu hanya mengisi data aktivitas dan bukti, sistem menghitung, verifikator memutuskan.</p>
      <button class="btn btn-primary" data-action="saveJournal">${icon('check', 16)} Simpan sebagai draf</button></div></div>`;
  } else if (t === 'jurnal') {
    const rows = journals(), q = (STATE.filter.jurnal || '').toLowerCase();
    const shown = rows.filter((r) => !q || (r.no + r.ur + r.akun + r.per).toLowerCase().includes(q));
    body = `<div class="card"><div class="row" style="justify-content:space-between"><b>Daftar jurnal</b><div class="row"><label class="sr-only" for="jFilter">Cari jurnal</label><input class="input" id="jFilter" style="width:220px" placeholder="Cari nomor, akun, bulan" value="${esc(STATE.filter.jurnal || '')}" data-input="jFilter">${full ? `<button class="btn btn-outline btn-sm" data-action="koreksi">${icon('file', 14)} Jurnal koreksi</button>` : ''}</div></div>
      <div class="table-wrap" style="margin-top:10px" id="jTable"><table><thead><tr><th>Nomor</th><th>Periode</th><th>Akun</th><th>Uraian</th><th class="r">Aktivitas</th><th class="r">Emisi (t CO₂e)</th><th>Tingkat data</th><th>Status</th></tr></thead><tbody>
      ${shown.map((r) => `<tr><td class="mono small">${r.no}</td><td>${r.per}</td><td class="mono">${r.akun}</td><td>${r.ur}${r.memo ? ' <span class="chip chip-gray">memo</span>' : ''}</td><td class="r num">${r.act === null ? 'tidak ada' : fmt(r.act) + ' ' + r.sat}</td><td class="r num">${r.e === null ? 'tidak ada' : fmt(r.e)}</td><td class="small">${r.tier}</td><td>${r.draft ? '<span class="chip chip-gray">Draf</span>' : r.kor ? '<span class="chip chip-lav">Koreksi, menunggu verifikator</span>' : r.closed ? `<span class="chip chip-gray" tabindex="0" data-tip="Periode tertutup tidak bisa diedit. Gunakan jurnal koreksi.">${icon('lock', 12)} Ditutup</span>` : '<span class="chip chip-brand">Diposting</span>'}</td></tr>`).join('') || `<tr><td colspan="8">Tidak ada jurnal yang cocok.</td></tr>`}</tbody></table></div>
      <p class="xs muted" style="margin-top:8px">Jurnal bulanan 1101 dibagi dari total tahunan dengan bobot bulanan ${lbl('FIKTIF')}. Pembulatan per baris bisa membuat jumlah baris berbeda 1 sampai 2 ton dari saldo.</p></div>`;
  } else {
    const list = docs().filter((d) => !klh || d.tek);
    body = `<div class="card"><div class="row" style="justify-content:space-between"><b>${klh ? 'Bukti teknis' : 'Pusat bukti'}</b><span class="xs muted">Sidik SHA-256 dihitung di peramban</span></div>
      <div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Dokumen</th><th>Jenis</th><th>Dipakai oleh</th><th>Versi</th><th>Sidik digital</th><th>Aksi</th></tr></thead><tbody>
      ${list.map((d) => `<tr><td>${d.n}</td><td>${d.j}</td><td class="mono small">${d.used}</td><td>v${d.v}</td><td class="mono xs" data-sha="${esc(d.id + '|' + d.n + '|v' + d.v)}">menghitung</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${full ? `<button class="btn btn-outline btn-sm" data-action="docVer" data-id="${d.id}">Ganti versi baru</button><span tabindex="0" data-tip="Dokumen sudah dipakai jurnal sehingga tidak bisa dihapus, hanya diganti versi baru."><button class="btn btn-ghost btn-sm" disabled aria-disabled="true">Hapus</button></span>` : '<span class="xs muted">Lihat saja</span>'}</div></td></tr>`).join('')}</tbody></table></div>
      ${full ? `<div class="drop" style="margin-top:12px" role="button" tabindex="0" data-action="fakeUpload" data-what="Dokumen baru">${icon('upload', 22)}<div class="small"><b>Tarik berkas ke sini</b> atau klik untuk unggah (simulasi)</div></div>` : ''}</div>`;
  }
  return `${head('catat', lbl('FIKTIF'))}${a !== 'penuh' ? `<div class="callout info" style="margin-bottom:14px">${icon('eye', 20)}<div class="small">Akses ${LEVEL_TXT[a].toLowerCase()}. Formulir dan aksi ubah disembunyikan untuk peran ini.</div></div>` : ''}${tabs('catat', items)}${panel('catat', body)}`;
}
const jEmisi = () => { const f = STATE.jForm; return f.src === '1101' ? f.act * C.faktorPerTon() : f.act * DATA.faktorSolar; };
const jFormula = () => STATE.jForm.src === '1101' ? `${fmt(STATE.jForm.act)} t × ${fmt(DATA.nilaiKalor)} GJ/t × ${fmt(DATA.faktorTJ, 2)} t/TJ ÷ 1.000 = ${fmt(jEmisi())} t` : `${fmt(STATE.jForm.act)} kL × ${fmt(DATA.faktorSolar, 2)} t/kL = ${fmt(jEmisi())} t`;

/* ---------- 10. LAYAR 3, UJI SILANG ---------- */
function renderUji() {
  const a = access('uji');
  if (a === 'agregat') return aggregateView('uji');
  const u = C.uji(), n = C.ujiNeraca(), risk = C.skorRisiko(), from = STATE.lastRisk === null ? 0 : STATE.lastRisk;
  const canExplain = STATE.role === 'peserta' && !STATE.explained;
  const z = (C.intensitas() - DATA.sebaran.mu) / DATA.sebaran.sd;
  const card = (t, i, formula, data, extra = '') => `<div class="card test-card ${t.band}" ${t.key === 'neraca' ? 'data-tour="neraca"' : ''}><div class="row" style="justify-content:space-between"><b>${i + 1}. ${t.nama}</b>${bandChip(t.band)}</div><div class="xs muted" style="margin:4px 0 8px">Bobot ${DATA.bobotUji[t.key]} ${lbl('ASUMSI')}</div><div class="formula">${formula}</div><div class="small" style="margin-top:8px">${data}</div>${extra}</div>`;
  const cards = [
    card(u[0], 0, 'Selisih = (E buku − E hitung dari pembelian) ÷ E hitung', `E buku besar ${fmt(C.scope1())} t · E dari faktur ${fmt(n.eHitung)} t<br>Selisih <b class="num">${fmtPct(n.dev)}</b>${STATE.explained ? ` · kenaikan stok ${fmt(n.kenaikanStok)} t sudah dijelaskan` : ''}`,
      canExplain ? `<button class="btn btn-primary btn-sm" style="margin-top:10px" data-action="explain">${icon('upload', 14)} Tambah penjelasan</button>` : STATE.explained ? `<div class="callout ok" style="margin-top:10px;padding:10px">${icon('check', 18)}<div class="small">Berita acara stok opname diterima. Selisih terjelaskan penuh.</div></div>` : STATE.role === 'djp' ? `<button class="btn btn-outline btn-sm" style="margin-top:10px" data-action="askExplain">Minta penjelasan peserta</button>` : ''),
    card(u[1], 1, 'z = (intensitas − rerata sebaran) ÷ simpangan', `Intensitas ${fmt(C.intensitas(), 3)} t/MWh · rerata ${fmt(DATA.sebaran.mu, 3)} · simpangan ${fmt(DATA.sebaran.sd, 3)}<br>z = <b class="num">${fmt(z, 2)}</b> · efisiensi implisit ${fmtPct(C.efisiensi(), 1)} (wajar untuk PLTU subkritis)`),
    card(u[2], 2, 'Selisih = (MWh dijual peserta − MWh dibeli PLN) ÷ MWh PLN', `Peserta ${fmt(DATA.ujiLain.scope2.peserta)} MWh · PLN ${fmt(DATA.ujiLain.scope2.pln)} MWh · selisih <b class="num">${fmtPct(u[2].dev)}</b><br>Memastikan ton yang sama tidak dipajaki dua kali di sisi pelanggan.`),
    card(u[3], 3, 'Selisih jam operasi = (buku − SISPEK) ÷ SISPEK', `Jam operasi buku ${fmt(DATA.ujiLain.cems.buku)} · ${term('SISPEK')} ${fmt(DATA.ujiLain.cems.sispek)} · selisih <b class="num">${fmtPct(u[3].dev)}</b><br>Laju alir: sesuai rentang (simulasi). Yang dibandingkan jam operasi dan laju alir, bukan ton CO₂.`),
    card(u[4], 4, 'Unit diserahkan di TAKAR = unit dikunci di SRUK', `Diserahkan ${fmt(STATE.unitsSurrendered)} unit · tercatat ${term('SRUK')} ${fmt(STATE.unitsSurrendered)} unit · tidak terpakai ganda`)
  ];
  const out = `${head('uji', lbl('FIKTIF'))}
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card" style="text-align:center"><b>Skor risiko gabungan</b> ${lbl('ASUMSI')}<div class="gauge-wrap" style="margin-top:6px" data-gauge-from="${from}" data-gauge-to="${risk}">${gauge(from)}</div><div class="small muted">0 sampai 100. ${risk <= 10 ? 'Risiko rendah, siap diverifikasi.' : 'Ada uji yang perlu penjelasan.'}</div></div>
    <div class="card"><b>Pita ambang dan bobot</b> ${lbl('ASUMSI')}<div class="row" style="margin:10px 0;gap:6px">${bandChip('g')}<span class="xs">≤ 1%</span>${bandChip('y')}<span class="xs">> 1% sampai 5%</span>${bandChip('r')}<span class="xs">> 5%</span></div>
      <div class="formula">Skor = Σ bobot × nilai pita (hijau 0,05 · kuning 0,5 · merah 1)<br>Bobot neraca 30 · intensitas 20 · Scope 2 15 · CEMS 20 · unit 15</div>
      <p class="xs muted" style="margin-top:8px">Bobot dan ambang ditampilkan agar bisa diaudit. Nilainya asumsi penulis, bukan regulasi.</p></div></div>
  <div class="grid g2">${cards.join('')}</div>`;
  return out;
}

/* ---------- 11. LAYAR 4, VERIFIKASI ---------- */
function assignList(stage) {
  return `<div class="lvv-list" id="lvvList">${DATA.lvvs.map((l) => { const out = l.out && stage >= l.out, pick = !l.out && stage >= 3; return `<div class="lvv ${out ? 'out' : ''} ${pick ? 'pick' : ''}"><span class="ico-circle ${pick ? 'pastel-2' : 'pastel-4'}" style="width:34px;height:34px">${icon(pick ? 'check' : 'shield', 16)}</span><div><b class="small">${l.n}</b><div class="xs muted">${out || pick ? l.why : 'Kandidat'}</div></div></div>`; }).join('')}</div>`;
}
function assignCard() {
  const st = STATE.assigned ? 3 : 0;
  const steps = ['Saring akreditasi KAN, ruang lingkup pembangkitan listrik', 'Singkirkan LVV yang menjadi konsultan peserta 2 tahun terakhir', 'Rotasi dan beban penugasan'];
  return `<div class="card" data-tour="assign"><div class="row" style="justify-content:space-between"><b>Mesin penugasan otomatis</b>${lbl('USULAN')}</div>
    <div class="stepper" id="assignSteps" style="margin:12px 0">${steps.map((s, i) => `<div class="s ${st > i ? 'done' : ''}">${i + 1}. ${s}</div>`).join('')}</div>
    ${assignList(st)}
    <div class="row" style="margin-top:12px">${STATE.assigned ? `<span class="chip chip-green">${icon('check', 12)} Ditugaskan: LVV Samudra Mutu (fiktif)</span>` : `<button class="btn btn-primary btn-sm" data-action="assign">${icon('play', 14)} Jalankan penugasan</button>`}
    <span class="chip chip-gray" tabindex="0" data-tip="Peserta tidak dapat memilih atau menolak verifikator. Penugasan dilakukan sistem.">${icon('lock', 12)} Peserta tidak bisa memilih</span></div>
    <p class="xs muted" style="margin-top:10px">Tidak ada tagihan jasa verifikasi ke peserta. Honor LVV dibayar lewat BPDLH dari alokasi APBN.</p></div>`;
}
const OPINI_TXT = { proses: 'Belum terbit', terverifikasi: 'Terverifikasi', koreksi: 'Terverifikasi dengan koreksi', tidak_lolos: 'Tidak lolos, memicu nilai baku' };
function opinionCard() {
  return `<div class="card"><b>Opini verifikasi</b><div style="margin:10px 0">${statusChip()}</div>
    <div class="small">Hasil: <b>${OPINI_TXT[STATE.verif]}</b>${STATE.verif !== 'proses' ? `, keyakinan ${STATE.opiniLevel}` : ''}</div>
    ${STATE.verif === 'tidak_lolos' ? `<div class="callout bad" style="margin-top:10px">${icon('alert', 18)}<div class="small">Hanya opini <b>tidak lolos</b> yang memicu ${term('nilai baku')}. Peserta dapat mengajukan pembuktian di Laporan Fiskal.</div></div>` : ''}
    <div style="margin-top:12px"><b class="small">Temuan</b>${STATE.temuan.map((t) => `<div class="alert-row" style="cursor:default"><span class="ico-circle pastel-3" style="width:30px;height:30px">${icon('info', 14)}</span><span class="small">${esc(t)}</span></div>`).join('')}</div></div>`;
}
function renderVerifikasi() {
  const a = access('verifikasi');
  if (STATE.role === 'kan') return `${head('verifikasi', lbl('ASUMSI'))}<div class="callout info" style="margin-bottom:14px">${icon('eye', 20)}<div class="small">KAN melihat beban penugasan dan hasil opini secara agregat, bukan isi buku besar.</div></div>` + dashKAN().replace(/^[\s\S]*?<div class="card">/, '<div class="card">');
  if (a === 'opini') return `${head('verifikasi')}<div class="grid g2">${opinionCard()}<div class="card"><b>Penugasan</b><p class="small">${STATE.assigned ? 'LVV Samudra Mutu (fiktif), ditugaskan sistem.' : 'Belum ditugaskan.'}</p><p class="xs muted">Peran ini hanya melihat opini dan temuan.</p></div></div>`;
  if (STATE.role === 'peserta') {
    return `${head('verifikasi', statusChip())}<div class="grid g2">${assignCard()}<div>${opinionCard()}
      <div class="card" style="margin-top:16px"><div class="row">${takki(52)}<div class="small"><b>Ingin melihat dari kursi verifikator?</b><br>Pindah ke peran LVV untuk membuka ruang kerja dan menerbitkan opini.</div></div><button class="btn btn-outline btn-sm" style="margin-top:10px" data-action="setRole" data-role="lvv">Masuk sebagai LVV</button></div></div></div>`;
  }
  // LVV: ruang kerja + tirai fiskal
  if (!STATE.assigned) return `${head('verifikasi', '<span class="chip chip-lav">Tirai fiskal aktif</span>')}${empty('Belum ada penugasan', 'Penugasan datang dari sistem. Verifikator tidak bisa memilih peserta, dan peserta tidak bisa memilih verifikator.', `<button class="btn btn-primary btn-sm" data-action="assign">${icon('play', 14)} Simulasikan penugasan</button>`)}`;
  const t = STATE.tab.verif, items = [['buku', 'Buku besar'], ['bukti', 'Bukti'], ['uji', 'Uji silang'], ['temuan', 'Temuan'], ['opini', 'Opini']];
  let body = '';
  if (t === 'buku') body = `<div class="card"><div class="table-wrap"><table><thead><tr><th>Akun</th><th>Uraian</th><th class="r">Saldo (t CO₂e)</th><th>Perlakuan</th></tr></thead><tbody><tr><td class="mono">1101</td><td>Pembakaran batubara</td><td class="r num">${fmt(C.e1101())}</td><td>Scope 1</td></tr><tr><td class="mono">1102</td><td>Solar penyala</td><td class="r num">${fmt(C.e1102())}</td><td>Scope 1</td></tr><tr><td class="mono">2101</td><td>Listrik dibeli</td><td class="r num">${fmt(DATA.scope2Memo)}</td><td>Memo</td></tr><tr><td class="mono">9103</td><td>Unit diserahkan</td><td class="r num">${fmt(STATE.unitsSurrendered)} unit</td><td>SRUK</td></tr></tbody></table></div><button class="btn btn-ghost btn-sm" style="margin-top:10px" data-action="trace" data-key="scope1">${icon('link', 14)} Lacak saldo Scope 1</button></div>`;
  else if (t === 'bukti') body = `<div class="card"><div class="table-wrap"><table><thead><tr><th>Dokumen</th><th>Jenis</th><th>Sidik</th></tr></thead><tbody>${docs().map((d) => `<tr><td>${d.n}</td><td>${d.j}</td><td class="mono xs" data-sha="${esc(d.id + '|' + d.n + '|v' + d.v)}">menghitung</td></tr>`).join('')}</tbody></table></div></div>`;
  else if (t === 'uji') body = `<div class="card"><div class="table-wrap"><table><thead><tr><th>Uji</th><th class="r">Selisih</th><th>Pita</th></tr></thead><tbody>${C.uji().map((x) => `<tr><td>${x.nama}</td><td class="r num">${x.z ? 'z ' + fmt(x.dev, 2) : fmtPct(x.dev)}</td><td>${bandChip(x.band)}</td></tr>`).join('')}</tbody></table></div><p class="small" style="margin-top:8px">Skor risiko <b class="num">${fmt(C.skorRisiko(), 1)}</b></p></div>`;
  else if (t === 'temuan') body = `<div class="card">${STATE.temuan.map((x) => `<div class="alert-row" style="cursor:default"><span class="ico-circle pastel-3" style="width:30px;height:30px">${icon('info', 14)}</span><span class="small">${esc(x)}</span></div>`).join('')}<div class="row" style="margin-top:10px;flex-wrap:nowrap"><label class="sr-only" for="temuanIn">Temuan baru</label><input class="input" id="temuanIn" placeholder="Tulis temuan baru"><button class="btn btn-primary btn-sm" data-action="addTemuan">Tambah</button></div></div>`;
  else body = `<div class="card"><b>Terbitkan opini</b><div class="field" style="margin-top:12px"><label>Tingkat keyakinan</label><div class="seg" role="group" aria-label="Tingkat keyakinan">${['memadai', 'terbatas'].map((x) => `<button aria-pressed="${STATE.opiniLevel === x}" data-action="opLevel" data-v="${x}">Keyakinan ${x}</button>`).join('')}</div></div>
    <div class="field"><label>Hasil</label><div class="grid g3" style="gap:8px">${[['terverifikasi', 'Terverifikasi', 'pastel-2'], ['koreksi', 'Terverifikasi dengan koreksi', 'pastel-1'], ['tidak_lolos', 'Tidak lolos', 'pastel-5']].map(([k, tt, c]) => `<button class="card hov" style="padding:12px;text-align:left;cursor:pointer;${STATE.verif === k ? 'box-shadow:inset 0 0 0 2px var(--brand)' : ''}" data-action="opini" data-v="${k}"><span class="ico-circle ${c}" style="width:32px;height:32px">${icon(k === 'tidak_lolos' ? 'alert' : 'check', 16)}</span><b class="small" style="display:block;margin-top:6px">${tt}</b></button>`).join('')}</div></div>
    <p class="xs muted">Hanya "tidak lolos" yang memicu nilai baku. Efeknya langsung terlihat di sisi peserta. Kamu tidak melihat berapa rupiah dampaknya.</p>
    ${STATE.verif !== 'proses' ? `<button class="btn btn-ghost btn-sm" data-action="opini" data-v="proses">Tarik opini (reset demo)</button>` : ''}</div>`;
  return `${head('verifikasi', '<span class="chip chip-lav">Tirai fiskal aktif</span>')}<div class="callout warn" style="margin-bottom:14px">${icon('eye', 20)}<div class="small"><b>Dampak pajak disembunyikan.</b> ${term('tirai fiskal')} aktif. Penugasan: ${DATA.perusahaan} (fiktif), tahun buku ${DATA.tahunBuku}.</div></div>${tabs('verif', items)}${panel('verif', body)}`;
}

/* ---------- 12. LAYAR 5, TAKAR ---------- */
function stepCalc(v) {
  const ph = STATE.phase, nb = v === 'nilaibaku', E = C.eEfektif(v);
  const eTxt = nb ? `${fmt(C.nilaiBaku(), 3)} × ${fmt(DATA.output)} MWh = ${fmt(E)} t (nilai baku)` : `${fmt(E)} t (Scope 1 terverifikasi)`;

/* ---------- 17. JEJAK AUDIT (rantai hash SHA-256) ---------- */
async function sha256(txt) {
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* jatuh ke cadangan */ }
  let h = '', s = 2166136261;
  for (let r = 0; r < 8; r++) { for (let i = 0; i < txt.length; i++) { s ^= txt.charCodeAt(i) + r; s = Math.imul(s, 16777619) >>> 0; } h += s.toString(16).padStart(8, '0'); }
  return h;
}
let chainQ = Promise.resolve();
function addChain(aksi, data) {
  chainQ = chainQ.then(async () => {
    const prev = STATE.chain.length ? STATE.chain[STATE.chain.length - 1].hash : '0'.repeat(64);
    const id = STATE.chain.length + 1, waktu = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const hash = await sha256([prev, id, aksi, data].join('|'));
    STATE.chain.push({ id, waktu, aksi, data, prev, hash, ok: true });
    if (currentScreen() === 'audit') rerender();
  });
  return chainQ;
}
async function verifyChain() {
  let broken = false;
  for (let i = 0; i < STATE.chain.length; i++) {
    const c = STATE.chain[i], prev = i ? STATE.chain[i - 1].hash : '0'.repeat(64);
    const h = await sha256([c.prev, c.id, c.aksi, c.data].join('|'));
    if (!broken && (h !== c.hash || c.prev !== prev)) broken = true;
    c.ok = !broken;
  }
  return !broken;
}

  const r = STATE.role;
  if (r === 'bpdlh') return ['Penerimaan agregat', 'Kas Negara', 'APBN', 'BPDLH', 'Pos dan proyek'].map((n, i) => `<button class="trace-node" data-action="go" data-to="transparansi"><b>${n}</b><span class="xs muted">${i === 0 ? fmtRp(STATE.phase === 1 ? 0 : sektorPenerimaan()) : 'agregat'}</span></button>`).join(icon('arrow', 14));
  const nodes = traceNodes(r === 'klh' ? 'teknis' : 'pajak');
  return nodes.map((n) => `<button class="trace-node" data-action="trace" data-key="${r === 'klh' ? 'teknis' : 'pajak'}"><b>${n[0]}</b><span class="xs muted">${n[1]}</span></button>`).join(icon('arrow', 14));

/* ---------- 20. KOMPONEN UI: QR, modal, toast, konfeti, count-up, tooltip ---------- */
function qrSvg(code, size = 120) {
  const n = 25; let s = 0;
  for (const ch of code) s = (Math.imul(s, 31) + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#0F172A"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#0F172A"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
  let cells = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!inF(x, y) && rnd() > 0.52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg class="qr" width="${size}" height="${size}" viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges" role="img" aria-label="Kode QR gaya untuk ${esc(code)}"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><g fill="#0F172A">${cells}</g>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
}

  setTimeout(() => { const f = m.querySelector('input,textarea,select,button:not([data-action="closeModal"])') || m.querySelector('button'); f && f.focus(); }, 30);
}

function toast(msg, kind = 'info') {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span style="color:${kind === 'ok' ? '#b8e08a' : kind === 'bad' ? '#fdba74' : '#9cd8e9'}">${icon(kind === 'ok' ? 'check' : kind === 'bad' ? 'alert' : 'info', 18)}</span><span>${msg}</span>`;
  $('#toasts').appendChild(t);

function confetti() {
  if (reduced()) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.width = innerWidth; c.height = innerHeight; c.setAttribute('aria-hidden', 'true');
  document.body.appendChild(c);
  const g = c.getContext('2d'), cols = ['#099ec8', '#84bc41', '#f9c416', '#9cd8e9', '#DDD6FE'];
  const ps = Array.from({ length: 110 }, () => ({ x: innerWidth / 2 + (Math.random() - 0.5) * 200, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 11 - 3, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
  const t0 = performance.now();
  (function f(t) {
    g.clearRect(0, 0, c.width, c.height);
    ps.forEach((p) => { p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.a += 0.2; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6); g.restore(); });
    if (t - t0 < 1600) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function countUp(el, from, to, f, ms = 900) {
  if (!el) return;
  if (reduced() || from === to) { el.textContent = f(to); return; }
  const t0 = performance.now();
  (function step(t) { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = f(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); })(t0);
}
// Tooltip glosarium dan label sumber
function showTip(el) {
  const tip = $('#tip'), txt = el.getAttribute('data-tip'); if (!txt) return;
  tip.textContent = txt; tip.classList.add('show');
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)), y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = r.top - h - 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

  verifyChain: async () => { const ok = await verifyChain(); rerender(); toast(ok ? 'Rantai utuh, semua sidik cocok' : 'Rantai putus, ada sidik yang tidak cocok', ok ? 'ok' : 'bad'); },
  newVersion: () => { addChain('Draf parameter versi baru', 'v3 disiapkan, menunggu penetapan'); toast('Versi v3 disiapkan sebagai draf (simulasi)', 'ok'); },
  addUser: () => openModal(`<h2 style="margin-top:0">Undang pengguna</h2><div class="field"><label for="uN">Nama</label><input class="input" id="uN" value="Pengguna baru (fiktif)"></div><div class="field"><label for="uR">Peran internal</label><select class="input" id="uR"><option value="akuntan">Akuntan karbon</option><option value="reviewer">Reviewer internal</option><option value="admin">Admin</option></select></div><button class="btn btn-primary" data-action="submitUser">Kirim undangan</button>`, 'Undang pengguna'),
  submitUser: () => { STATE.extraUsers = (STATE.extraUsers || []).concat([[$('#uN').value || 'Tanpa nama', $('#uR').value]]); closeAll(); rerender(); toast('Undangan terkirim (simulasi)', 'ok'); }
};
const INPUTS = {
  role: (el) => setRole(el.value),
  jSrc: (el) => { STATE.jForm.src = el.value; STATE.jForm.act = el.value === '1101' ? 211267 : 343; rerender(); },

  jTier: (el) => { STATE.jForm.tier = el.value; },
  jFilter: (el) => { STATE.filter.jurnal = el.value; refresh('jTable'); },

  edu: (el) => { STATE[el.dataset.k] = +el.value; $('#' + el.dataset.k + 'V').textContent = fmt(+el.value, el.dataset.k === 'eduQ' ? 0 : 2); refresh('eduOut'); },
  beta: (el) => { STATE.beta = +el.value; $('#betaV').textContent = fmt(STATE.beta, 1); refresh('klSteps', 'klTable'); },
  porsi: (el) => { STATE.porsi = +el.value; $('#porsiV').textContent = fmt(STATE.porsi * 100) + '%'; refresh('klSteps', 'klTable'); },
  alloc: (el) => { rebalance(el.dataset.k, +el.value); Object.entries(STATE.alloc).forEach(([k, v]) => { $('#al-' + k + 'V').textContent = v + '%'; if (k !== el.dataset.k) $('#al-' + k).value = v; }); $('#alTot').textContent = Object.values(STATE.alloc).reduce((a, b) => a + b, 0) + '%'; refresh('ffWrap'); },
  projFilter: (el) => { STATE.filter.proyek = el.value; refresh('projTable'); },
  paramVer: (el) => { STATE.paramVersion = el.value; addChain('Versi parameter dipilih', 'Intensitas rujukan ' + el.value); rerender(); toast(`Hitungan kini memakai parameter ${el.value}. Nilai baku ${fmt(C.nilaiBaku(), 3)}`); },
  perm: (el) => { STATE.perms[el.dataset.r][+el.dataset.i] = el.checked ? 1 : 0; toast('Izin diperbarui (simulasi)', 'ok'); }
};

/* ---------- 26. MODE DEMO 3 MENIT ---------- */
const tour = { active: false, i: 0, timers: [], target: null };
const TOUR = [
  { s: 'dasbor', t: '[data-tour="ribbon"]', say: () => 'Halo, aku Takki. Pita ini menunjukkan rezim yang berlaku, Fase 2 cap-and-tax. Semua angka mengikuti rezim ini. Di bawahnya, kartu Langkah berikutnya selalu memberi tahu apa yang harus dikerjakan.', pre: () => { resetDemo(); STATE.phase = 2; STATE.role = 'peserta'; } },
  { s: 'dasbor', t: '#drawer', say: () => `Angka emisi Scope 1 bisa diklik. Panel Lacak membuka rantainya: rupiah, ${fmt(C.scope1())} t, buku besar, jurnal 1101, data aktivitas, sampai faktur batubara.`, post: () => openTrace('pajak', 5) },
  { s: 'uji', t: '[data-tour="neraca"]', say: () => `Uji neraca bahan bakar kuning, selisih ${fmtPct(C.devAwal())}. Tenang, stoknya cuma naik. Aku unggahkan berita acara stok opname, lihat pitanya berubah hijau.`, post: () => later(1800, doExplain), finish: () => { if (!STATE.explained) { STATE.explained = true; addChain('Penjelasan uji neraca bahan bakar', 'Berita acara stok opname'); } } },
  { s: 'verifikasi', t: '[data-tour="assign"]', say: () => 'Sistem memilih verifikator lewat tiga saringan. Peserta tidak bisa memilih, dan tidak ada tagihan jasa verifikasi. Setelah itu LVV menerbitkan opini terverifikasi.', post: () => later(600, () => runAssign(() => later(500, () => setOpini('terverifikasi')))), finish: () => { STATE.assigned = true; if (STATE.verif === 'proses') { STATE.verif = 'terverifikasi'; addChain('Opini LVV terbit', 'Terverifikasi, keyakinan memadai'); } } },
  { s: 'takar', t: '[data-tour="switch"]', say: () => `Adegan utamanya. Bila data tidak lolos, berlaku nilai baku. Pajak melonjak dari ${fmtRp(C.pajakF2('terverifikasi', 0))} ke ${fmtRp(C.pajakF2('nilaibaku', 0))}. Mengukur menghemat ${fmtRp(C.pajakF2('nilaibaku', 0) - C.pajakF2('terverifikasi', 0))}.`, pre: () => { STATE.calcView = 'terverifikasi'; }, post: () => later(1300, calcSwitch), finish: () => { STATE.calcView = null; } },
  { s: 'fiskal', t: '[data-tour="coretax"]', say: () => 'Lampiran Karbon dicek pra-validasi, lalu dikirim lewat jembatan Coretax: disiapkan, dikirim, diproses, diterima.', pre: () => { STATE.calcView = null; }, post: () => later(500, () => runPrevalid(() => later(300, sendCoretax))), finish: () => { STATE.prevalid = STATE.prevalidRun = true; if (STATE.coretax < 4) { STATE.coretax = 4; addChain('Lampiran Karbon dikirim ke Coretax', 'Status diterima'); } } },
  { s: 'pulangkan', t: '[data-tour="cert"]', say: () => `Data terverifikasi pulang ke hilir. Sertifikat faktor emisi ${fmt(C.intensitas(), 3)} t/MWh untuk pelanggan listrik, lengkap dengan QR yang bisa dipindai.`, pre: () => { STATE.tab.pulangkan = 's2'; }, post: () => later(900, () => { issueCert(); later(900, () => { openModal(qrPublic('s2'), 'Halaman publik sertifikat'); tour.target = '#modal'; tourPlace(false); }); }), finish: () => { if (!STATE.certIssued) { STATE.certIssued = true; addChain('Sertifikat Scope 2 terbit', 'TKR-S2-ABC-2026'); } } },
  { s: 'transparansi', t: '[data-tour="publik"]', say: () => 'Terakhir, dasbor publik. Hanya angka agregat, minimal tiga entitas, dan aliran dana Kas Negara ke APBN ke BPDLH. Satu ton dihitung sekali. Satu angka, satu bukti.', pre: () => { STATE.role = 'publik'; } }
];
function startTour() {
  closeAll(); tour.active = true;
  if (!$('#tourSpot')) {
    const sp = document.createElement('div'); sp.className = 'tour-spot'; sp.id = 'tourSpot'; sp.setAttribute('aria-hidden', 'true');
    const bx = document.createElement('div'); bx.className = 'tour-box'; bx.id = 'tourBox'; bx.setAttribute('role', 'dialog'); bx.setAttribute('aria-label', 'Mode Demo 3 Menit'); bx.setAttribute('aria-live', 'polite');
    document.body.append(sp, bx);
  }
  tourStep(0);
}
function tourStep(i) {
  tour.timers.forEach(clearTimeout); tour.timers = [];
  if (tour.active && i > tour.i && TOUR[tour.i].finish) TOUR[tour.i].finish();
  closeAll(); tour.i = i; tour.target = null;
  const st = TOUR[i]; st.pre && st.pre();
  const h = '#/portal/' + st.s;
  if (location.hash !== h) location.hash = h; else rerender();
  $('#tourBox').innerHTML = `<div>${takki(64)}</div><div><div class="xs muted" style="font-weight:800">LANGKAH ${i + 1} DARI ${TOUR.length}</div><div class="say" style="margin:6px 0 12px">${st.say()}</div><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn btn-ghost btn-sm" data-action="tourPrev" ${i ? '' : 'disabled aria-disabled="true"'}>Kembali</button><button class="btn btn-ghost btn-sm" data-action="tourEnd">Lewati</button><button class="btn btn-primary btn-sm" data-action="tourNext" style="margin-left:auto">${i === TOUR.length - 1 ? 'Selesai' : 'Lanjut'} ${icon('arrow', 14)}</button></div></div>`;
  setTimeout(() => { $('#tourBox [data-action="tourNext"]').focus({ preventScroll: true }); tourPlace(true); st.post && st.post(); if (st.t === '#drawer') setTimeout(() => tourPlace(false), 400); }, 250);
}
function tourPlace(scroll) {
  if (!tour.active) return;
  const sel = tour.target || TOUR[tour.i].t, el = $(sel), sp = $('#tourSpot'), bx = $('#tourBox');
  if (!el) { sp.style.cssText = 'top:50%;left:50%;width:0;height:0'; bx.style.top = '20%'; bx.style.left = '50%'; bx.style.transform = 'translateX(-50%)'; return; }
  if (scroll && !['#drawer', '#modal'].includes(sel)) el.scrollIntoView({ block: 'center', behavior: 'auto' });
  const r = el.getBoundingClientRect(), pad = 8;
  const top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad), w = Math.min(innerWidth - 8, r.width + pad * 2), hh = Math.min(innerHeight - 8, r.height + pad * 2);
  Object.assign(sp.style, { top: top + 'px', left: left + 'px', width: w + 'px', height: hh + 'px' });
  const bw = bx.offsetWidth, bh = bx.offsetHeight, mobile = innerWidth < 640;
  let bt, bl;
  if (mobile) { bt = innerHeight - bh - 12; bl = (innerWidth - bw) / 2; }
  else if (sel === '#drawer') { bt = 80; bl = Math.max(12, r.left - bw - 20); }
  else if (r.bottom + bh + 20 < innerHeight) { bt = r.bottom + 14; bl = Math.min(innerWidth - bw - 12, Math.max(12, r.left)); }
  else if (r.top - bh - 20 > 0) { bt = r.top - bh - 14; bl = Math.min(innerWidth - bw - 12, Math.max(12, r.left)); }
  else { bt = innerHeight - bh - 16; bl = Math.max(12, innerWidth - bw - 16); }
  bx.style.transform = ''; bx.style.top = bt + 'px'; bx.style.left = bl + 'px';
}
function endTour(done) {
  tour.timers.forEach(clearTimeout); tour.timers = []; tour.active = false;
  $('#tourSpot') && $('#tourSpot').remove(); $('#tourBox') && $('#tourBox').remove(); closeAll();
  toast(done ? 'Demo selesai. Silakan klik-klik sendiri.' : 'Demo dilewati');
}
Object.assign(ACTIONS, {
  tourNext: () => { if (tour.i >= TOUR.length - 1) endTour(true); else tourStep(tour.i + 1); },
  tourPrev: () => { if (tour.i > 0) tourStep(tour.i - 1); },
  tourEnd: () => endTour(false)
});

/* ---------- 27. EVENT GLOBAL & INISIALISASI ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  const np = $('#notifPop');
  if (np && np.classList.contains('show') && !e.target.closest('.bell')) np.classList.remove('show');
  if (!el || el.disabled) return;
  const f = ACTIONS[el.dataset.action]; if (f) f(el, e);
});
document.addEventListener('input', (e) => { const el = e.target; if (el.matches('select,[type=checkbox]')) return; if (el.id === 'palIn') { palFilter(el.value); return; } const f = INPUTS[el.dataset.input]; f && f(el); });
document.addEventListener('change', (e) => { const el = e.target; if (!el.matches('select,[type=checkbox]')) return; const f = INPUTS[el.dataset.input]; f && f(el); });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') { if ($('#palette').classList.contains('show') || $('#modal').classList.contains('show') || $('#drawer').classList.contains('show')) closeAll(); else if (tour.active) endTour(false); return; }
  if ($('#palette').classList.contains('show') && e.target.id === 'palIn') {
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); palDraw(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palDraw(); }
    if (e.key === 'Enter') { e.preventDefault(); palRun(palSel); }
    return;
  }
  // jebakan fokus sederhana untuk dialog terbuka
  if (e.key === 'Tab') {
    const d = ['#modal', '#drawer'].map((s) => $(s)).find((x) => x.classList.contains('show'));
    if (d) { const f = $$('button:not([disabled]),input,select,textarea,[tabindex="0"]', d); if (f.length) { const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } } }
  }
  const el = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && el.matches('[data-action]:not(button):not(a):not(input)')) { e.preventDefault(); el.click(); }
});
document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('focusin', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('scroll', () => { hideTip(); if (tour.active) tourPlace(false); }, { passive: true });
window.addEventListener('resize', () => { if (tour.active) tourPlace(false); });
$('#overlay').addEventListener('click', () => { if (!tour.active) closeAll(); else closeAll(); });
window.addEventListener('hashchange', () => { closeAll(); route(); });

  pushNotif('penting', 'Uji neraca bahan bakar kuning, perlu penjelasan', 'uji', ['peserta', 'djp', 'klh']);

  pushNotif('info', 'Simulasi penerimaan sektor contoh tersedia', 'dasbor', ['bkf', 'bpdlh']);
  addChain('Faktur batubara diunggah', `Pembelian ${fmt(DATA.pembelianBatubara)} t, dokumen D-01`);
  addChain('Jurnal 1101 diposting', `Akun 1101, ${fmt(Math.round(C.e1101()))} t CO₂e, tingkat data uji lab dan CEMS`);
  addChain('Jurnal 1102 diposting', `Akun 1102, ${fmt(Math.round(C.e1102()))} t CO₂e, faktor baku`);

  route();
})();
